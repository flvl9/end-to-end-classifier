datamodule:
  train_batch_size: 32
  val_batch_size: 32
  n_workers: 11

tuning:
  n_trials: 10
  n_epochs: 20
  seed: 32
  accelerator: "gpu"
  optuna_n_jobs: 1
  trainer_devices: 1
  search_space:
    lr: [1.0e-5, 1.0e-3]
    conv_layers: [1, 3]
    filters: [32, 128]
    kernel_sizes: [3, 5]
    dropout: [0.1, 0.6]
    fc_size: [32, 128]

training:
  accelerator: "gpu"
  n_epochs: 30
  n_devices: 1
  early_stopping:
    patience: 5
    min_delta: 0.01
  seed: 32
